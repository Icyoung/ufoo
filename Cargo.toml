[workspace]
resolver = "2"
members = [
  "crates/ufoo-tui",
]

[workspace.package]
edition = "2021"
license = "SEE LICENSE IN LICENSE"
authors = ["UFOO Team"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.28"
ratatui = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "signal", "time"] }
clap = { version = "4", features = ["derive"] }
ansi-to-tui = "7"
