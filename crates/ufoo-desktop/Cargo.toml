[package]
name = "ufoo-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "macOS Desktop GUI host for ufoo (Tauri v2 + ufoo-ui/1)"

[[bin]]
name = "Ufoo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "process", "time"] }
tauri = { version = "2", features = ["macos-private-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.5"
