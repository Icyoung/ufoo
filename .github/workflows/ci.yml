name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: "18.17.0"
          - os: ubuntu-24.04
            node: "20"
          - os: macos-15-intel
            node: "22"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  tui:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build ufoo-tui
        run: cargo build -p ufoo-tui --release
      - name: Test Rust renderer
        run: cargo test -p ufoo-tui
      - name: Version probe
        run: ./target/release/ufoo-tui --version

  desktop-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm --prefix apps/desktop ci
      - name: Build desktop UI and verify runtime entrypoints
        run: |
          npm run desktop:ui:build
          node -e "require('./src/app/chat'); require('./src/ui/desktopUiHost'); require('./src/agents/acp/acpServer'); console.log('ok')"
