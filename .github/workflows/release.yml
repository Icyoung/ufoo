name: Release

# Publish u-foo to npm with multi-platform ufoo-tui binaries under dist/tui/.
#
# Trigger:
#   - Push tag vX.Y.Z (package.json version must match X.Y.Z)
#   - workflow_dispatch (publishes current package.json version)
#
# Required secret: NPM_TOKEN (npm automation token with publish rights for u-foo)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only (skip npm publish)"
        type: boolean
        default: false
      reuse_arm_run_id:
        description: "Optional prior run with a tested ARM artifact and identical Rust sources"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    name: Verify supported runtimes and builds
    uses: ./.github/workflows/ci.yml

  build-tui:
    name: Build ufoo-tui (${{ matrix.plat }})
    runs-on: ${{ matrix.plat == 'darwin-arm64' && inputs.reuse_arm_run_id != '' && 'ubuntu-24.04' || matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            plat: darwin-arm64
            target: ""
          - os: macos-15-intel
            plat: darwin-x64
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            plat: linux-x64
            target: ""
          - os: ubuntu-24.04-arm
            plat: linux-arm64
            target: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify reusable ARM artifact source and tests
        if: matrix.plat == 'darwin-arm64' && inputs.reuse_arm_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_arm_run_id }}
        run: |
          set -euo pipefail
          [[ "$REUSE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid source run ID" >&2; exit 1; }
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID")"
          source_sha="$(jq -r '.head_sha' <<< "$run")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          jq -e --arg repo "$GITHUB_REPOSITORY" \
            '.head_repository.full_name == $repo and .path == ".github/workflows/release.yml"' <<< "$run"
          git merge-base --is-ancestor "$source_sha" HEAD
          git diff --exit-code "$source_sha" HEAD -- \
            crates Cargo.toml Cargo.lock .cargo rust-toolchain rust-toolchain.toml
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID/jobs?filter=all&per_page=100" \
            | jq -s -e '[.[].jobs[] | select(.name == "Build ufoo-tui (darwin-arm64)" and .conclusion == "success")
              | select(any(.steps[]; .name == "Build release binary" and .conclusion == "success"))
              | select(any(.steps[]; .name == "Test host Rust renderer" and .conclusion == "success"))
              | select(any(.steps[]; .name == "Stage binary" and .conclusion == "success"))] | length > 0'
          echo "Reusing tested ARM binary from $source_sha (run $REUSE_RUN_ID); Rust sources and lockfile are identical."

      - name: Download verified ARM artifact
        if: matrix.plat == 'darwin-arm64' && inputs.reuse_arm_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: tui-darwin-arm64
          path: dist/tui/darwin-arm64
          run-id: ${{ inputs.reuse_arm_run_id }}
          github-token: ${{ github.token }}

      - name: Check reused ARM binary format
        if: matrix.plat == 'darwin-arm64' && inputs.reuse_arm_run_id != ''
        run: |
          set -euo pipefail
          file dist/tui/darwin-arm64/ufoo-tui | grep -E 'Mach-O.*arm64'
          chmod +x dist/tui/darwin-arm64/ufoo-tui

      - name: Install Rust
        if: matrix.plat != 'darwin-arm64' || inputs.reuse_arm_run_id == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        if: matrix.plat != 'darwin-arm64' || inputs.reuse_arm_run_id == ''
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build -p ufoo-tui --release --target "${{ matrix.target }}"
          else
            cargo build -p ufoo-tui --release
          fi

      - name: Test host Rust renderer
        if: matrix.plat != 'darwin-arm64' || inputs.reuse_arm_run_id == ''
        run: cargo test -p ufoo-tui

      - name: Stage binary
        if: matrix.plat != 'darwin-arm64' || inputs.reuse_arm_run_id == ''
        run: |
          set -euo pipefail
          plat="${{ matrix.plat }}"
          mkdir -p "dist/tui/${plat}"
          if [ -n "${{ matrix.target }}" ]; then
            src="target/${{ matrix.target }}/release/ufoo-tui"
          else
            src="target/release/ufoo-tui"
          fi
          if [ ! -f "$src" ] && [ -f "${src}.exe" ]; then
            src="${src}.exe"
          fi
          cp "$src" "dist/tui/${plat}/ufoo-tui"
          chmod +x "dist/tui/${plat}/ufoo-tui"
          file "dist/tui/${plat}/ufoo-tui" || true
          "./dist/tui/${plat}/ufoo-tui" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.plat }}
          path: dist/tui/${{ matrix.plat }}/ufoo-tui
          if-no-files-found: error

  publish:
    name: Publish npm
    needs: [build-tui, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Download TUI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tui-*
          path: dist/tui-artifacts

      - name: Assemble dist/tui
        run: |
          set -euo pipefail
          mkdir -p dist/tui
          for dir in dist/tui-artifacts/tui-*; do
            [ -d "$dir" ] || continue
            plat="$(basename "$dir" | sed 's/^tui-//')"
            mkdir -p "dist/tui/${plat}"
            if [ -f "$dir/ufoo-tui" ]; then
              cp "$dir/ufoo-tui" "dist/tui/${plat}/ufoo-tui"
            elif [ -f "$dir/ufoo-tui.exe" ]; then
              cp "$dir/ufoo-tui.exe" "dist/tui/${plat}/ufoo-tui"
            else
              echo "missing binary in $dir" >&2
              ls -la "$dir" >&2
              exit 1
            fi
            chmod +x "dist/tui/${plat}/ufoo-tui"
          done
          echo "Staged platforms:"
          find dist/tui -type f -print
          node scripts/pack-tui.js --check

      - name: Install dependencies
        run: npm ci

      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify tag matches package.json (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - name: Pack dry-run
        run: npm pack --dry-run

      - name: Publish
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
